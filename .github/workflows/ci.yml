name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Compile TypeScript
        run: pnpm build

      - name: Checkout Penguin-Git daemon
        uses: actions/checkout@v4
        with:
          repository: labs-ayush/Penguin-Git
          path: ../PenguinGit

      - name: Build daemon binary
        run: cargo build --bin penguingit-mcp
        working-directory: ../PenguinGit

      - name: Run unit tests
        run: pnpm test

      - name: Package VSIX extension
        run: pnpm package
